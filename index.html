<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- META AMAN -->
  <meta name="description" content="Halaman kontak resmi untuk komunikasi melalui WhatsApp, Facebook, dan Telegram.">
  <meta name="robots" content="index, follow">

  <title>Kontak Resmi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    /* overlay biar aman & jelas */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .profile-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    .mail {
      margin-top: 8px;
      font-size: 20px;
    }

    .emoji {
      margin-top: 10px;
      font-size: 26px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #2b2b2b;
      border-radius: 40px;
      padding: 15px;
      margin: 12px 20px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      border: 2px solid #3a3a3a;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    .btn:hover {
      background: #3a3a3a;
      transform: scale(1.03);
    }

    .icon {
      width: 28px;
      height: 28px;
    }

    .note {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="profile-wrapper">
      <img class="profile">
      <div class="mail">💌</div>
      <div class="emoji">🤗</div>
    </div>

    <!-- TEXT AMAN -->
    <p class="desc">
      Halaman kontak resmi. Silakan hubungi melalui platform berikut.
    </p>

    <a id="waBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" class="icon">
      WhatsApp
    </a>

    <a id="fbBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="icon">
      Facebook DATING
    </a>

    <a id="tgBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" class="icon">
      TELEGRAM
    </a>

    <!-- NOTE TAMBAHAN -->
    <p class="note">
      Kami tidak menyimpan data pribadi Anda.
    </p>

  </div>

  <script src="config.js" defer></script>
</body>
</html>
