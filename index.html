<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .profile-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
    }

    .mail {
      margin-top: 8px;
      font-size: 20px;
    }

    .emoji {
      margin-top: 10px;
      font-size: 26px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #2b2b2b;
      border-radius: 40px;
      padding: 15px;
      margin: 12px 20px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      border: 2px solid #3a3a3a;
      transition: 0.3s;
    }

    .btn:hover {
      background: #3a3a3a;
      transform: scale(1.03);
    }

    .icon {
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="profile-wrapper">
      <img class="profile">
      <div class="mail"></div>
      <div class="emoji"></div>
    </div>

    <a id="waBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" class="icon">
      WhatsApp
    </a>

    <a id="fbBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="icon">
      Facebook DATING
    </a>

    <a id="tgBtn" class="btn">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" class="icon">
      TELEGRAM
    </a>

  </div>

  <!-- PENTING: pakai defer -->
  <script src="config.js" defer></script>

</body>
</html>
